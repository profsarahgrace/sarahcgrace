<style>

/* Layout idea: a working case room. Left = the current step; right = the loop, always visible, so every choice shows its ripple. */
:root{
  --red:#9D2235; --red-dk:#7A1A28; --blossom:#F3D8DC; --rose:#FCF4F5;
  --bg:#FAF7F7; --surface:#FFFFFF; --ink:#1E191A; --muted:#625659; --line:#E5D6D8;
  --good:#2F7A5F; --down:#B4501A; --good-bg:#E4F2EC; --down-bg:#FBEBE1;

  --body:"DM Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --red:#E06A82; --red-dk:#F08DA0; --blossom:#3A2228; --rose:#241A1C;
    --bg:#151112; --surface:#1E1819; --ink:#F2EBEC; --muted:#B5A7AA; --line:#3A2F31;
    --good:#6CC6A0; --down:#F0985E; --good-bg:#1C3029; --down-bg:#3A2619;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --red:#E06A82; --red-dk:#F08DA0; --blossom:#3A2228; --rose:#241A1C;
  --bg:#151112; --surface:#1E1819; --ink:#F2EBEC; --muted:#B5A7AA; --line:#3A2F31;

.memo{border-left:4px solid var(--red);background:var(--rose);padding:14px 16px;border-radius:0 8px 8px 0}

.facts{counter-reset:f;list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}

label{font-weight:700;font-size:.92rem;display:block;margin-bottom:4px}
.hint{font-weight:400;color:var(--muted);font-size:.84rem}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--blossom)}
.count{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-align:right}
.count.ok{color:var(--good)}

.btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}
:root[data-theme="dark"] .btn{color:#1a0d10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#1a0d10}}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red)}
.gate{font-size:.85rem;color:var(--muted)}

/* quiz */
.q{border:1px solid var(--line);border-radius:10px;padding:14px}
.q .qopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.q button.a{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.q button.a:hover:not([disabled]){border-color:var(--red)}
.q button.a.right{background:var(--good-bg);border-color:var(--good)}
.q button.a.wrong{background:var(--down-bg);border-color:var(--down)}
.q button.a[disabled]{cursor:default}
.why{margin-top:8px;font-size:.9rem;color:var(--muted)}
.why b{color:var(--ink)}

/* ripple */
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.d{font-family:var(--mono);font-size:.82rem;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.d.up{background:var(--good-bg);color:var(--good)}
.d.dn{background:var(--down-bg);color:var(--down)}

.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.voice{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.voice .who{font-weight:700;font-size:.9rem}
.voice .role{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.voice p{font-size:.94rem}
.ai-note{font-size:.78rem;color:var(--muted)}
.thinking{color:var(--muted);font-style:italic}
.chat{display:flex;flex-direction:column;gap:8px}
.chat .m{padding:9px 12px;border-radius:8px;max-width:90%}
.chat .m.us{background:var(--blossom);align-self:flex-end}
.chat .m.them{background:var(--bg);border:1px solid var(--line)}
.callout{background:var(--blossom);border-radius:8px;padding:12px 14px;font-size:.94rem}

/* side loop */
.loopcard h3{font-size:1rem;font-family:var(--body);font-weight:700}
.loopcard svg{width:100%;height:auto;display:block}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .lab{display:flex;justify-content:space-between;font-size:.84rem}
.meter .lab .v{font-family:var(--mono)}
.track{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--red);border-radius:999px}

/* drawer */
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.15);padding:22px;overflow-y:auto;z-index:20;display:none}

.drawer a{color:var(--red)}

pre.log{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;max-height:420px;overflow:auto}
.banner{font-size:.85rem;background:var(--blossom);color:var(--ink);border-radius:8px;padding:10px 14px}
.member{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.member.absent{opacity:.55}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 30px;font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.foot a{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:180px 1fr 40px;gap:10px;align-items:center;font-size:.9rem}
.barrow .track{height:14px}
.barrow .n{font-family:var(--mono);text-align:right}
@media (max-width:500px){.barrow{grid-template-columns:110px 1fr 30px}}
body.classmode{font-size:18px}
body.classmode .lede{max-width:none}
.btn.askq{text-align:left;font-weight:500;padding:8px 12px}
.pill{font-size:.75rem;border-radius:999px;padding:1px 8px;background:var(--rose);border:1px solid var(--line);white-space:nowrap}
/* ---- Shein solo additions ---- */
.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
ol.plan{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.flywheel{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
ol.flywheel li::marker{color:var(--red);font-family:var(--mono)}
ul.since{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.panel h3{color:var(--ink)}
details.clips{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--bg)}

.askers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.asker{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.asker .who{font-weight:700;font-size:.92rem}
.asker .role{font-size:.78rem;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.btn.askq{font-size:.88rem;line-height:1.35}
.btn.askq[disabled]{opacity:.6}
.facts li > span{display:block}
.whocard h3{font-size:1.05rem;font-family:var(--body);font-weight:700}
.subh{margin:16px 0 8px}
.mrows{display:flex;flex-direction:column;gap:10px}
.mrow .lab{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;margin-bottom:4px}
.mrow .lab .v{font-family:var(--mono);white-space:nowrap}
.fill.cost{background:var(--red)}
.fill.biz{background:var(--muted)}
.d.good{background:var(--good-bg);color:var(--good)}

.flag{display:inline-block;font-size:.7rem;font-weight:700;padding:0 6px;border-radius:999px;background:var(--down-bg);color:var(--down);white-space:nowrap}

<script>
/* =========================================================
   CASE CONTENT: Shein, Fall 2026 test run (individual makeup sim)
   Framework: Externalized Costs Analysis. No PIVOTAL.
   Every response is scripted here; nothing calls an AI.
   ========================================================= */
const CASE = {
  id: "shein-fall26-solo",
  retailer: "Shein",
  title: "Shein: The Bill Comes Due",
  kicker: "MKTG 44303 · Simulation · Individual",
  bigQuestion: "What happens when we want cheap stuff more than we care where it comes from? Are consumers the problem, or is the system broken?",
  role: "You are Shein's U.S. president, late 2026.",

  costs: [
    {id:"labor", name:"Labor", who:"workers"},
    {id:"env", name:"Environmental", who:"ecosystems and future generations"},
    {id:"community", name:"Community", who:"designers and local businesses"},
    {id:"consumer", name:"Consumer", who:"buyers, after the sale"}
  ],
  biz: [
    {id:"sales", name:"U.S. sales"},
    {id:"price", name:"Price advantage"},
    {id:"investors", name:"Investor confidence"}
  ],
  baseline: {labor:85, env:85, community:70, consumer:70, sales:55, price:70, investors:50},

  personas: {
    mei:    {name:"Mei Lin", role:"Garment worker at a Guangzhou supplier, paid by the piece (fictional)"},
    ana:    {name:"Ana Ruiz", role:"Independent designer whose work was copied (fictional)"},
    jordan: {name:"Jordan Hale, 19", role:"Shein customer on a tight budget, who loves Shein (fictional)"},
    priya:  {name:"Priya Desai", role:"Fund manager who bought Shein shares at the IPO (fictional)"},
    dana:   {name:"Dana Cole", role:"Labor-rights researcher (fictional)"}
  },
  room: ["mei","ana","jordan","priya"],

  /* ---------- What you missed ---------- */
  brief: {
    intro: "You missed Monday and Wednesday, when the class watched Channel 4's “Untold: Inside the Shein Machine” (2022) and stopped six times to discuss it. This briefing gives you what the film showed and what the class concluded. Read it closely: the decisions ahead use all of it.",
    clips: {
      note: "Optional, if you have time and YouTube works for you: watch the parts of the film the class discussed most. Turn captions on; prices are in pounds (a £4 top is about $5).",
      links: [
        ["The buying end: how Shein sells (5:14 to 24:33)", "https://www.youtube.com/watch?v=qpClEvsjW0s&t=314s"],
        ["Fern's copied design and the factory (24:33 to 34:01)", "https://www.youtube.com/watch?v=qpClEvsjW0s&t=1473s"],
        ["Clothes no one can resell, and Shein's answer (34:01 to the end)", "https://www.youtube.com/watch?v=qpClEvsjW0s&t=2041s"]
      ]
    },
    panels: [
      {h:"1 · The machine: how does a £4 top exist?",
       p:["Shein was founded in 2008 in Nanjing, China. It has no stores. It sells online, straight from a network of about 6,000 small supplier factories centered on Guangzhou. It adds thousands of new styles a day; Zara adds about 12,000 a year.",
          "The engine is a test-and-reorder system the class built as a flywheel (LATR):"],
       steps:["An algorithm scans social media for emerging trends","A micro-batch is commissioned: 100 to 200 units from a factory partner","The items go up on the app as a live test","Demand is measured within days","Hits are reordered at volume; misses are quietly dropped","The fastest, cheapest factories get the next order"],
       after:["This is genuine innovation. Harvard's John Deighton argues Shein is a platform matching demand signals to factory capacity, not a retailer. The class held onto that, and then asked: step 2 needs factories on standby, and step 5 needs them to ramp up overnight. What does that ask of the people in them?"]},
      {h:"2 · The buying end: how Shein sells (Monday)",
       p:["Safia, 17, works in a café to fund her shopping. A top she loved cost about £38 elsewhere; Shein's near-copy cost about £4. She lives in a small town where she stands out anyway, so she may as well look good doing it. The class treated her reasons as good reasons: clothes as identity, at a price she can afford.",
          "A researcher in the film counted dark patterns on fast-fashion sites (countdown timers, coupon stacks, infinite scroll, add-on discounts), and Shein came out far ahead of every other site. The class asked: is the choice to buy free, or engineered? The shopper brings the budget, the identity and the taste. The app brings the timers, the drops and the urgency.",
          "Shein's marketing runs on micro-influencers paid in product: about five free items and a 15% discount code. Some are teenagers. Agencies coach creators to post three times a day for a chance at paid deals later.",
          "Inside the first factory: no pay for the first month, fines for mistakes that cost a large share of a day's pay, and 14-hour shifts still running at 10 p.m."],
       callout:"Monday's close: Shein's speed is real innovation, and it depends on people at both ends who carry more than their share of the cost. Creators are paid in clothes; workers are paid by the piece and fined for mistakes."},
      {h:"3 · The framework: Externalized Costs Analysis (Wednesday)",
       p:["An externalized cost is a real cost transferred to people who did not agree to bear it. It isn't avoided; it's shifted. A low price can reflect real efficiency, or it can reflect someone else paying the difference."],
       table:{head:["Category","Who bears it","Where it showed up this week"],
         rows:[["Labor","Workers","Piece rates, fines, 14- to 18-hour days (film); 75-hour weeks still standard in 2024 (Public Eye)"],
               ["Environmental","Ecosystems and future generations","About 150 billion garments made a year; clothes a charity can't resell (film); 16.7 million tonnes of CO₂ in 2023 (Shein's own data)"],
               ["Community","Designers and local businesses","Fern's copied lace set (film); a federal racketeering suit over design copying; the duty-free exemption competitors didn't get"],
               ["Consumer","Buyers, after the sale","Dark patterns and fake urgency; clothes built for one wear; chemical test findings; France's €40M fine over fake discounts"]]},
       callout:"The test: remove the externalization. Does the advantage survive? If it doesn't, the externalization isn't a failure of the model. It is the model."},
      {h:"4 · The making end: who pays (Wednesday)",
       p:["Fern, an independent designer, sold a handmade lace set for about £65 to £70; each one takes about 3.5 hours to make. Shein's near-identical copy sold for £4 to £7. After she posted about it, Shein pulled the listing, sent her an email address, and never replied. In the same part of the film, one worker earned about £19 for an 18-hour day.",

  {key:"r2",      label:"Results",          min:3},
  {key:"room",    label:"Face the room",    min:7},
  {key:"reflect", label:"Reflection",       min:4},
  {key:"log",     label:"Submit",           min:0}
];

const MIN = {name:2, claim:80, why:40, test:50, rec:120, sent:25, reply:40, reflect:60};

const PREDICT = [...CASE.costs.map(c=>({id:c.id, name:c.name})),
  {id:"moved", name:"It moves costs somewhere else more than it reduces them"},
  {id:"none", name:"It barely changes any of them"}];

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const opt = (d, id) => CASE.decisions[d].options.find(o=>o.id===id);
const metricName = id => (CASE.costs.find(c=>c.id===id) || CASE.biz.find(b=>b.id===id) || {}).name || id;
const predictName = id => (PREDICT.find(p=>p.id===id)||{}).name || "";

function fresh(){
  const dec = () => ({choice:null, predict:"", fit:"", pays:"", risk:"", locked:false, asked:[]});
  return {v:1, phase:0, name:"", section:"", startTs:null, activeMs:0, finishedAt:null,
    check:{}, claims:{c1:"", c2:""},
    d1:dec(), d2:dec(), t1:"", t2:"",
    room:{rec:"", mei:"", ana:"", jordan:"", priya:"", ch:null, reply:"", done:false},
    ref:{q1:"", q2:""}};
}
function load(){ try{ const t = localStorage.getItem(STORE_KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
let S = (()=>{ const f = fresh(), l = load(); if(!l || l.v !== 1) return f;
  for(const k in f){ if(l[k] !== undefined){ f[k] = (f[k] && typeof f[k]==="object" && !Array.isArray(f[k]) && l[k] && typeof l[k]==="object") ? Object.assign(f[k], l[k]) : l[k]; } }
  return f; })();
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }, 250); }
const phaseKey = () => PHASES[Math.min(S.phase, PHASES.length-1)].key;
const idxOf = key => PHASES.findIndex(p=>p.key===key);
function goKey(key){ S.phase = idxOf(key); if(key==="log" && !S.finishedAt) S.finishedAt = Date.now(); save(); render(); window.scrollTo(0,0); const h = $("#main h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } }

/* ---------- scoring ---------- */
function compute(){
  const cur = {...CASE.baseline}, moved = [], combos = [];
  const add = fx => { for(const k in fx){ cur[k] = (cur[k]||0) + fx[k]; } };
  const mv = (list, when) => (list||[]).forEach(m => moved.push({cat:m[0], where:m[1], when}));
  const snaps = [{...cur}];
  if(S.d1.locked){ const o = opt(0, S.d1.choice); add(o.fx); mv(o.moved, "Decision 1"); }
  snaps.push({...cur});
  if(S.d2.locked){
    const o = opt(1, S.d2.choice); add(o.fx); mv(o.moved, "Decision 2");
    (CASE.decisions[1].combos||[]).forEach(c => { if(c.when.d1===S.d1.choice && c.when.d2===S.d2.choice){ add(c.fx); mv(c.moved, "Combined effect"); combos.push(c); } });
  }
  snaps.push({...cur});
  snaps.forEach(sn => { for(const k in sn) sn[k] = Math.max(0, Math.min(100, sn[k])); });
  return {base:snaps[0], a1:snaps[1], a2:snaps[2], cur:snaps[S.d2.locked?2:(S.d1.locked?1:0)], combos, moved};
}
const isCost = id => CASE.costs.some(c=>c.id===id);
function deltaBadge(id, d){
  if(!d) return `<span class="d zero">0</span>`;
  const good = isCost(id) ? d < 0 : d > 0;
  return `<span class="d ${good?"good":"bad"}">${d>0?"+":"−"}${Math.abs(d)}</span>`;
}

/* ---------- side panel ---------- */
function renderSide(){
  const c = compute();
  let prev = null, note = "Starting point";
  if(S.d2.locked){ prev = c.a1; note = "After Decision 2"; } else if(S.d1.locked){ prev = c.base; note = "After Decision 1"; }
  const movedCats = new Set(c.moved.map(m=>m.cat));
  const row = (m, isC) => {
    const v = c.cur[m.id], d = prev ? v - prev[m.id] : 0;
    return `<div class="mrow"><div class="lab"><span><b>${esc(m.name)}</b>${isC?` <span class="hint">${esc(m.who)}</span>`:""}${isC && movedCats.has(m.id)?` <span class="flag" title="Some of this cost was moved, not removed">⇄ moved</span>`:""}</span><span class="v">${v} ${prev?deltaBadge(m.id,d):""}</span></div>
      <div class="track" role="img" aria-label="${esc(m.name)}: ${v} of 100"><div class="fill ${isC?"cost":"biz"}" style="width:${v}%"></div></div></div>`;
  };
  $("#sideCard").innerHTML = `
    <div class="row sb"><h3>Who pays?</h3><span class="pill">${note}</span></div>
    <p class="hint" style="margin:2px 0 10px">Costs Shein pushes onto others. Higher means more is pushed onto them.</p>
    <div class="mrows">${CASE.costs.map(m=>row(m,true)).join("")}</div>
    <h3 class="subh">Shein's business</h3>
    <div class="mrows">${CASE.biz.map(m=>row(m,false)).join("")}</div>
    ${c.moved.length?`<div class="movedbox"><b>⇄ Moved, not removed</b><ul>${c.moved.map(m=>`<li><b>${esc(metricName(m.cat))}:</b> ${esc(m.where)}</li>`).join("")}</ul></div>`:""}
    <p class="testline">The test: remove the externalization. Does the advantage survive?</p>
    <p class="attrib">Scores are simulation values, not company data. Framework: Externalized Costs Analysis (MKTG 44303).</p>`;
}

/* ---------- form helpers ---------- */
function getPath(p){ return p.split(".").reduce((o,k)=>o==null?o:o[k], S); }
function setPath(p, v){ const ks = p.split("."), last = ks.pop(); const o = ks.reduce((o,k)=>o[k], S); o[last] = v; }
function field(path, label, hint, min, rows){
  const value = getPath(path) || "", n = len(value), id = "f-" + path.replace(/\./g,"-");
  return `<div><label for="${id}">${label}${hint?` <span class="hint">${hint}</span>`:""}</label>
    <textarea id="${id}" data-bind="${path}" data-min="${min}" rows="${rows||3}">${esc(value)}</textarea>
    <div class="count ${n>=min?"ok":""}" data-count="${path}">${n>=min?"✓":`${n} / ${min} characters`}</div></div>`;
}
function line(path, label, hint, min){
  const value = getPath(path) || "", n = len(value), id = "f-" + path.replace(/\./g,"-");
  return `<div><label for="${id}">${label}${hint?` <span class="hint">${hint}</span>`:""}</label>
    <input type="text" id="${id}" data-bind="${path}" data-min="${min}" value="${esc(value)}">
    ${min?`<div class="count ${n>=min?"ok":""}" data-count="${path}">${n>=min?"✓":`${n} / ${min} characters`}</div>`:""}</div>`;
}
const voice = (id, text) => `<div class="voice"><div class="who">${esc(P(id).name)}</div><div class="role">${esc(P(id).role)}</div><p>“${esc(text)}”</p></div>`;

/* ---------- gates ---------- */
const decK = i => i===0 ? "d1" : "d2";
const GATES = {
  setup: ()=> len(S.name) >= MIN.name ? "" : "Add your name to start.",
  brief: ()=> {
    const miss = [];
    if(Object.keys(S.check).length < CASE.check.length) miss.push("answer all four check questions");
    if(CASE.brief.claims.items.some(c=>len(S.claims[c.id]) < MIN.claim)) miss.push("test both of Shein's claims");
    return miss.length ? "To continue, " + miss.join(" and ") + "." : "";
  },
  d1: ()=> decGate(0), d2: ()=> decGate(1),
  r1: ()=> len(S.t1) >= MIN.test ? "" : "Run the test before you move on.",
  r2: ()=> len(S.t2) >= MIN.test ? "" : "Run the test before you move on.",
  room: ()=> {
    if(!S.room.ch){ const miss = []; if(len(S.room.rec) < MIN.rec) miss.push("your recommendation"); CASE.room.forEach(id=>{ if(len(S.room[id]) < MIN.sent) miss.push(`a sentence to ${P(id).name.split(",")[0]}`); });
      return miss.length ? "Still needed: " + miss.join(", ") + "." : ""; }
    return len(S.room.reply) >= MIN.reply ? "" : "Answer the question from the room to finish.";
  },
  reflect: ()=> (len(S.ref.q1) >= MIN.reflect && len(S.ref.q2) >= MIN.reflect) ? "" : "Answer both reflection questions.",
  log: ()=> ""
};
const hasRisk = i => !CASE.decisions[i].noRisk;
function decGate(i){
  const st = S[decK(i)], miss = [];
  if(st.asked.length < 2) miss.push("ask the room at least two questions");
  if(!st.choice) miss.push("choose an option");
  if(!st.predict) miss.push("make your prediction");
  if(len(st.fit) < MIN.why || len(st.pays) < MIN.why || (hasRisk(i) && len(st.risk) < MIN.why)) miss.push(`answer ${hasRisk(i)?"all three":"both"} questions`);
  return miss.length ? "To lock it in, " + miss.join(", ") + "." : "";
}
function refreshGates(){
  const msg = (GATES[phaseKey()] || (()=>""))();
  const btn = document.querySelector("[data-primary]");
  if(btn) btn.disabled = !!msg;
  const g = $("#gateMsg"); if(g) g.textContent = msg;
}

    ${ch?`<section class="card stack" aria-live="polite">
      <div class="eyebrow">The room pushes back</div>
      ${voice(ch.who, ch.q)}
      ${field("room.reply", "Your answer", "Answer the question directly.", MIN.reply, 3)}
      <div class="row"><button class="btn" type="button" id="roomDone" data-primary>Go to reflection</button><span class="gate" id="gateMsg" aria-live="polite"></span></div>
    </section>`:""}`;
}
function pickChallenge(){
  const R = CASE.roomStep, W = R.words, lc = s => (s||"").toLowerCase();
  const has = (txt, list) => list.some(w => lc(txt).includes(w));
  const all = [S.room.rec, S.room.mei, S.room.ana, S.room.jordan, S.room.priya, S.t1, S.t2].join(" ");
  const plan = [S.room.rec, S.room.mei, S.room.ana, S.room.jordan, S.room.priya].join(" ");
  const sentences = [S.room.mei, S.room.ana, S.room.jordan, S.room.priya].join(" ");
  const c = compute();
  const tests = {
    claim1: ()=> has(plan, W.claim1),
    claim2: ()=> has(plan, W.claim2),
    moved: ()=> c.moved.length > 0 && !has(plan, W.moved),
    badnews: ()=> !has(sentences, W.badnews),
    tech: ()=> !has(all, W.tech),
    price: ()=> !has(S.room.rec + " " + S.room.jordan, W.price),
    growth: ()=> !has(S.room.rec + " " + S.room.priya, W.growth),
    fallback: ()=> true
  };
  const pick = R.challenges.find(x => tests[x.test]());
  return {who:pick.who, q:pick.q, test:pick.test};
}
function vReflect(){
  return `<section class="card stack">
      <div class="row sb"><div class="eyebrow">Step 8 · Reflection</div><span class="target">about ${PHASES[idxOf("reflect")].min} min</span></div>
      <h2>Two questions, on your own</h2>
      ${CASE.reflect.map((q,n)=>field("ref.q"+(n+1), `${n+1}. ${esc(q)}`, "", MIN.reflect, 4)).join("")}
      <div class="row"><button class="btn" type="button" id="toLog" data-primary>Finish and get my record</button><span class="gate" id="gateMsg" aria-live="polite"></span></div>
    </section>`;
}
function vLog(){
  const D = CASE.debrief;
  return `<section class="card stack">
      <div class="eyebrow">Step 9 · Submit</div>
      <h2>Upload your record to Blackboard</h2>
      ${canDownload()
        ? `<p class="lede">Download your record and upload it to this week's Blackboard assignment. If a download doesn't work, copy the text and paste it into the assignment instead.</p>
      <div class="row"><button class="btn" type="button" id="dlPdf">Download PDF</button><button class="btn ghost" type="button" id="dlDocx">Download Word</button><button class="btn ghost" type="button" id="copyLog">Copy as text</button></div>`
        : `<p class="lede">Copy your record and paste it into this week's Blackboard assignment (into the text box, or into a Word document you upload).${DL.ready?"":" Checking whether downloads are available here…"}</p>
      <div class="row"><button class="btn" type="button" id="copyLog">Copy as text</button></div>`}
      <p class="gate" id="copyMsg" aria-live="polite"></p>
      <pre class="log" id="logText">${esc(logText())}</pre>
    </section>
    <section class="card stack">
      <div class="eyebrow">Debrief</div>
      <h3>The tension this week</h3>
      <p>${esc(D.tension)}</p>
      <div class="voices">
        <div class="voice"><div class="who">Strong plans</div><ul>${D.strong.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="voice"><div class="who">Weak plans</div><ul>${D.weak.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>
      <p class="gate">Compare your plan with both lists before you upload. You can't edit it now, but you can say in class what you'd change.</p>
    </section>`;
}

/* ---------- record ---------- */
function checkScore(){ return CASE.check.reduce((t,q,i)=>t + (S.check[i]===q.c?1:0), 0); }
function scoreLine(snap){ return [...CASE.costs, ...CASE.biz].map(m=>`${m.name} ${snap[m.id]}`).join(" · "); }
function docModel(){
  const c = compute(), secs = [];
  const when = S.finishedAt ? new Date(S.finishedAt) : new Date();
  secs.push({h:"Student", rows:[["Name", S.name], ["Section", S.section || "-"], ["Completed", when.toLocaleString()], ["Time on task", fmt(S.activeMs) + " (minutes:seconds of active time before submitting)"], ["Briefing check", `${checkScore()} of ${CASE.check.length} correct`]]});
  secs.push({h:"Shein's two claims", rows: CASE.brief.claims.items.map(c=>[`${c.label}: ${c.claim}`, S.claims[c.id]])});
  [0,1].forEach(i=>{
    const D = CASE.decisions[i], k = decK(i), st = S[k]; if(!st.locked) return;
    const o = opt(i, st.choice), snap = i===0 ? c.a1 : c.a2;
    const rows = [["Choice", `Option ${o.id}: ${o.name}`], ["Prediction", `${predictName(st.predict)} (actual: ${o.key==="moved"?"mostly moved costs":o.key==="none"?"barely changed any cost":metricName(o.key)})`],
      [D.fit, st.fit], [CASE.text.pays, st.pays], ...(hasRisk(i)?[[CASE.text.risk, st.risk]]:[]),
      ["Questions asked", st.asked.map(key=>{ const [id,n] = key.split(":"); return `${P(id).name}: ${D.asks[id][+n][0]}`; }).join("\n")],
      ["What happened", o.later]];
    if(i===1) c.combos.forEach(cb=>rows.push(["Combined effect", cb.note]));
    rows.push(["Scoreboard after", scoreLine(snap)], [CASE.text.test, i===0 ? S.t1 : S.t2]);
    secs.push({h:`${D.label}: ${D.title}`, rows});
  });
  if(S.room.ch || len(S.room.rec)){
    const rows = [["Recommendation", S.room.rec], ...CASE.room.map(id=>[`To ${P(id).name}`, S.room[id]])];
    if(S.room.ch){ rows.push([`The room pushed back (${P(S.room.ch.who).name})`, S.room.ch.q], ["Reply", S.room.reply]); }
    secs.push({h:"Face the room", rows});
  }
  secs.push({h:"Reflection", rows: CASE.reflect.map((q,n)=>[q, S.ref["q"+(n+1)]])});
  secs.push({h:"Final scoreboard", rows:[["Start", scoreLine(c.base)], ["End", scoreLine(c.cur)], ["Moved, not removed", c.moved.length ? c.moved.map(m=>`${metricName(m.cat)}: ${m.where}`).join("\n") : "None"]]});
  return {sub:"MKTG 44303 | Shein makeup simulation", title:CASE.title, sections:secs};
}
function logText(){
  const m = docModel();
  return `${m.sub}\n${m.title}\n` + m.sections.map(s=>`\n== ${s.h.toUpperCase()} ==\n` + s.rows.map(([k,v])=>`${k}\n${v||"-"}\n`).join("\n")).join("");
}

/* ---------- files ---------- */
const libs = {};
function loadLib(url, g){
  if(window[g]) return Promise.resolve(window[g]);
  if(!libs[url]) libs[url] = new Promise((res, rej)=>{ const sc = document.createElement("script"); sc.src = url; sc.onload = ()=> window[g] ? res(window[g]) : rej(new Error("load")); sc.onerror = ()=>{ delete libs[url]; rej(new Error("load")); }; document.head.appendChild(sc); });
  return libs[url];
}
const JSPDF = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const DOCX = "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js";
const pdfSafe = s => String(s||"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—−]/g,"-").replace(/→/g,"->").replace(/·/g,"|").replace(/⇄/g,"<->").replace(/€/g,"EUR ").replace(/£/g,"GBP ").replace(/₂/g,"2").replace(/[^\x00-\xFF]/g,"");
async function buildPDF(){
  const lib = await loadLib(JSPDF, "jspdf");
  const doc = new lib.jsPDF({unit:"pt", format:"letter"});
  const M = 54, W = 612 - M*2, PHt = 792, RED = [157,34,53], INK = [30,25,26], MUTED = [98,86,89];
  const m = docModel(); let y;
  doc.setFillColor(...RED); doc.rect(0,0,612,78,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text(pdfSafe(m.sub).toUpperCase(), M, 30);
  doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.text(pdfSafe(m.title), M, 56);
  y = 108;
  const need = h => { if(y + h > PHt - M){ doc.addPage(); y = M; } };
  m.sections.forEach(sec=>{
    need(40);
    doc.setTextColor(...RED); doc.setFont("helvetica","bold"); doc.setFontSize(12.5);
    const hl = doc.splitTextToSize(pdfSafe(sec.h), W); doc.text(hl, M, y); y += hl.length*16;
    doc.setDrawColor(...RED); doc.setLineWidth(.8); doc.line(M, y-8, M+W, y-8); y += 6;
    sec.rows.forEach(([k,v])=>{
      const kl = doc.splitTextToSize(pdfSafe(k), W), vl = doc.splitTextToSize(pdfSafe(v||"-"), W);
      need(kl.length*11 + Math.min(vl.length,3)*13 + 4);
      doc.setTextColor(...MUTED); doc.setFont("helvetica","bold"); doc.setFontSize(8.5); kl.forEach(l=>{ doc.text(l, M, y); y += 11; }); y += 2;
      doc.setTextColor(...INK); doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
      vl.forEach(l=>{ need(13); doc.text(l, M, y); y += 13.5; });
      y += 8;
    });
    y += 8;
  });
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text(pdfSafe(`${S.name} | page ${i} of ${n}`), M, PHt-28); }
  return doc.output("blob");
}
async function buildDOCX(){
  const d = await loadLib(DOCX, "docx");
  const m = docModel(), kids = [];
  kids.push(new d.Paragraph({children:[new d.TextRun({text:m.sub.toUpperCase(), color:"9D2235", bold:true, size:18})]}));
  kids.push(new d.Paragraph({spacing:{after:240}, children:[new d.TextRun({text:m.title, bold:true, size:40, color:"1E191A"})]}));
  m.sections.forEach(sec=>{
    kids.push(new d.Paragraph({spacing:{before:280, after:120}, border:{bottom:{color:"9D2235", size:6, style:d.BorderStyle.SINGLE, space:2}}, children:[new d.TextRun({text:sec.h, bold:true, size:26, color:"9D2235"})]}));
    sec.rows.forEach(([k,v])=>{
      kids.push(new d.Paragraph({spacing:{before:120}, children:[new d.TextRun({text:String(k), bold:true, size:18, color:"625659"})]}));
      String(v||"-").split("\n").forEach(l=> kids.push(new d.Paragraph({spacing:{after:40}, children:[new d.TextRun({text:l, size:21})]})));
    });
  });
  return d.Packer.toBlob(new d.Document({styles:{default:{document:{run:{font:"Arial"}}}}, sections:[{properties:{page:{margin:{top:1080,bottom:1080,left:1080,right:1080}}}, children:kids}]}));
}
function fileBase(){ return `Shein_Simulation_${(S.name||"Record").replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,"")}`; }
/* Downloads: inside a claude.ai artifact view, page-started downloads are blocked, so use the
   platform's downloads capability when it is offered; as a standalone file, a normal link works.
   When neither is available, the page offers Copy as text only. */
const DL = {inArtifact: !!(window.claude && typeof window.claude.use === "function"), cap:null, ready:false};
if(DL.inArtifact){
  Promise.resolve().then(()=>window.claude.use("downloads")).then(d=>{ DL.cap = d || null; }).catch(()=>{ DL.cap = null; })
    .finally(()=>{ DL.ready = true; if(phaseKey()==="log") render(); });
} else { DL.ready = true; }
const canDownload = () => DL.inArtifact ? !!DL.cap : true;
async function saveBlob(blob, name){
  if(DL.inArtifact){ if(!DL.cap) throw new Error("nodl"); await DL.cap.save({filename:name, data:blob}); return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function download(kind, btn){
  const msg = $("#copyMsg"); btn.disabled = true; msg.textContent = "Building your file…";
  try{ await saveBlob(kind==="pdf" ? await buildPDF() : await buildDOCX(), `${fileBase()}.${kind}`); msg.textContent = "Saved. Upload the file to this week's Blackboard assignment."; }
  catch(e){ msg.textContent = (e && e.message==="load") ? "The file builder didn't load. Use “Copy as text” and paste your record into Blackboard instead." : "That download didn't go through. Use “Copy as text” and paste your record into Blackboard instead."; }
  finally{ btn.disabled = false; }
}
window.__simBuild = {buildPDF, buildDOCX, logText};

/* ---------- briefing drawer ---------- */
function openGuide(){
  $("#drawer").innerHTML = `<div class="row sb"><h3>The briefing</h3><button class="btn ghost" type="button" id="closeGuide">Close</button></div>
    <p class="gate" style="margin-top:6px">Everything from “What you missed,” for reference while you decide.</p>
    ${CASE.brief.panels.map(p=>`<h4>${esc(p.h)}</h4>${(p.p||[]).map(x=>`<p>${esc(x)}</p>`).join("")}${p.steps?`<ol>${p.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}${(p.after||[]).map(x=>`<p>${esc(x)}</p>`).join("")}${p.table?`<ul>${p.table.rows.map(r=>`<li><b>${esc(r[0])}</b> (${esc(r[1])}): ${esc(r[2])}</li>`).join("")}</ul>`:""}${p.list?`<ul>${p.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${p.callout?`<p class="callout">${esc(p.callout)}</p>`:""}`).join("")}
    <h4>Shein's two claims (open questions)</h4><ul>${CASE.brief.claims.items.map(c=>`<li><b>${esc(c.label)}:</b> ${esc(c.claim)}</li>`).join("")}</ul>
    <h4>Sources</h4><ul>${CASE.sources.map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ul>`;
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); $("#closeGuide").focus();
}
function closeGuide(){ $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }

/* ---------- render + events ---------- */
function render(){
  if(S.phase >= PHASES.length) S.phase = PHASES.length - 1;
  renderSteps(); renderSide();
  const views = {setup:vSetup, brief:vBrief, d1:()=>vDecision(0), r1:()=>vResult(0), d2:()=>vDecision(1), r2:()=>vResult(1), room:vRoom, reflect:vReflect, log:vLog};
  const active = document.activeElement && document.activeElement.id;
  $("#main").innerHTML = views[phaseKey()]();
  if(active){ const el = document.getElementById(active); if(el && (el.tagName==="TEXTAREA"||el.tagName==="INPUT"||el.tagName==="SELECT")) el.focus(); }
  refreshGates();
}
document.addEventListener("input", e=>{
  const t = e.target; if(!t.dataset || !t.dataset.bind) return;
  setPath(t.dataset.bind, t.value); save();
  const min = +t.dataset.min || 0, cnt = document.querySelector(`[data-count="${t.dataset.bind}"]`);
  if(cnt){ const n = len(t.value); cnt.textContent = n>=min ? "✓" : `${n} / ${min} characters`; cnt.classList.toggle("ok", n>=min); }
  if(t.dataset.bind==="name") $("#nameLabel").textContent = t.value || "Not started";
  refreshGates();
});
document.addEventListener("change", e=>{ const t = e.target; if(t.tagName==="SELECT" && t.dataset.bind){ setPath(t.dataset.bind, t.value); save(); refreshGates(); } });
document.addEventListener("click", e=>{
  const t = e.target.closest("button, a"); if(!t) return;
  if(t.id==="guideBtn"){ openGuide(); return; }
  if(t.id==="closeGuide"){ closeGuide(); return; }
  if(t.id==="restartLink"){ e.preventDefault(); $("#dialog").classList.add("open"); $("#dlgNo").focus(); return; }
  if(t.id==="dlgNo"){ $("#dialog").classList.remove("open"); return; }
  if(t.id==="dlgYes"){ S = fresh(); try{ localStorage.removeItem(STORE_KEY); }catch(_){} $("#dialog").classList.remove("open"); render(); window.scrollTo(0,0); return; }
  if(t.disabled) return;
  if(t.id==="startBtn"){ if(!S.startTs) S.startTs = Date.now(); goKey("brief"); return; }
  if(t.dataset.q !== undefined && t.dataset.a !== undefined){ const i = +t.dataset.q; if(S.check[i]!==undefined) return; S.check[i] = +t.dataset.a; save(); const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.id==="briefNext"){ goKey("d1"); return; }
  if(t.dataset.ask){ const k = phaseKey()==="d1" ? "d1" : "d2"; if(!S[k].asked.includes(t.dataset.ask)) S[k].asked.push(t.dataset.ask); save(); const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.opt){ const [k,id] = t.dataset.opt.split("|"); if(S[k].locked) return; S[k].choice = id; save(); const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.id==="lockBtn"){ const k = t.dataset.k; S[k].locked = true; goKey(k==="d1" ? "r1" : "r2"); return; }
  if(t.id==="toD2"){ goKey("d2"); return; }
  if(t.id==="toRoom"){ goKey("room"); return; }
  if(t.id==="readBtn"){ S.room.ch = pickChallenge(); save(); render(); const r = $("#f-room-reply"); if(r){ r.scrollIntoView({block:"center"}); r.focus({preventScroll:true}); } return; }
  if(t.id==="roomDone"){ S.room.done = true; goKey("reflect"); return; }
  if(t.id==="toLog"){ goKey("log"); return; }
  if(t.id==="dlPdf"){ download("pdf", t); return; }
  if(t.id==="dlDocx"){ download("docx", t); return; }
  if(t.id==="copyLog"){
    const txt = logText();
    const sel = ()=>{ const r = document.createRange(); r.selectNodeContents($("#logText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#copyMsg").textContent = "The text is selected. Press Ctrl+C (Cmd+C on a Mac) to copy it."; };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>{ $("#copyMsg").textContent = "Copied. Paste it into the Blackboard assignment."; }).catch(sel); } else sel();
    return;
  }
});
$("#scrim").addEventListener("click", closeGuide);
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeGuide(); $("#dialog").classList.remove("open"); } });
render();

</script>
